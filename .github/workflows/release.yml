name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: pi-flash-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip pi-flash release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
      - name: Bump patch version
        run: npm version patch --no-git-tag-version
      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public
      - name: Commit the published version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v$(node -p \"require('./package.json').version\") [skip pi-flash release]"
          git push origin HEAD:main
